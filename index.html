<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Elysia — Design and technology studio</title>
    <meta name="description" content="<!--@description-->" />
    <link rel="canonical" href="https://elysia.example/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Elysia" />
    <meta property="og:description" content="<!--@tagline-->" />
    <meta property="og:url" content="https://elysia.example/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#05030C" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The wordmark is the first thing that renders; its font should not be
         discovered halfway through parsing the stylesheet. -->
    <link
      rel="preload"
      href="/src/assets/fonts/syne-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Runs before first paint: marks the document as scripted, so the reveal
         animations only hide content that JavaScript can actually reveal, and
         applies the type set, which would otherwise reflow the whole page a
         moment after it rendered. The default set needs no attribute. -->
    <script>
      document.documentElement.classList.add('js');
      (function () {
        var sets = <!--@type-names-->;
        var wanted = new URLSearchParams(location.search).get('type');
        if (wanted && sets.indexOf(wanted) !== -1) {
          document.documentElement.setAttribute('data-type', wanted);
        }
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <a class="skip-link label" href="#practice">Skip to content</a>

    <header class="nav" id="nav">
      <div class="nav-shell">
        <a class="nav-mark" href="#top" aria-label="Elysia — back to top">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M2.4 15.2h19.2" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </a>
        <nav class="nav-links label" aria-label="Primary">
          <!--@nav-links-->
        </nav>
        <!--@nav-cta-->
      </div>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="wordmark">
        <div class="sky"></div>
        <canvas class="globe" id="globe" aria-hidden="true"></canvas>

        <div class="hero-name">
          <h1 class="wordmark" id="wordmark"><!--@site-name--></h1>
        </div>
        <p class="hero-sub label"><!--@tagline--></p>
      </section>

      <div class="deck">
        <div class="deck-tabs label" data-tablist aria-label="The system">
          <!--@bench-tabs-->
        </div>

        <section class="section bench" id="bench" aria-labelledby="bench-label">
          <div class="wrap">
            <span class="eyebrow label" id="bench-label">The system</span>
            <!--@bench-->
          </div>
        </section>

        <section class="section" id="practice" aria-labelledby="practice-label">
          <div class="wrap">
            <span class="eyebrow label" id="practice-label">Practice</span>
            <div class="split reveal">
              <!--@practice-->
            </div>
            <ul class="capabilities reveal">
              <!--@capabilities-->
            </ul>
          </div>
        </section>

        <section class="section" id="work" aria-labelledby="work-label">
          <div class="wrap">
            <span class="eyebrow label" id="work-label">Selected work</span>
            <div class="work reveal">
              <div class="work-head label" aria-hidden="true">
                <span>Project</span><span>Scope</span><span style="text-align: right">Year</span
                ><span></span>
              </div>
              <!--@work-->
            </div>
          </div>
        </section>

        <section class="section" id="studio" aria-labelledby="studio-label">
          <div class="wrap">
            <span class="eyebrow label" id="studio-label">Studio</span>
            <div class="split reveal">
              <!--@studio-->
            </div>
            <ul class="index-list index-list--facts reveal">
              <!--@facts-->
            </ul>
          </div>
        </section>

        <section class="section" id="contact" aria-labelledby="contact-label">
          <div class="wrap reveal">
            <span class="eyebrow label" id="contact-label">Contact</span>
            <!--@contact-->
          </div>
        </section>
      </div>
    </main>

    <footer class="foot">
      <div class="foot-top">
        <div class="foot-brand">
          <span class="foot-name"><!--@site-name--></span>
          <p class="foot-tagline label"><!--@tagline--></p>
        </div>
        <nav class="foot-nav label" aria-label="Footer">
          <!--@footer-groups-->
        </nav>
      </div>
      <p class="legal label">
        <span
          >&copy;
          <!--@year-->
          <!--@site-name-->
          Studio</span
        >
        <span>A fictional studio, built as a front-end exercise</span>
      </p>
    </footer>

    <script type="application/ld+json">
      <!--@structured-data-->
    </script>
  </body>
</html>
